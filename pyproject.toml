[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops_cloud"
version = "0.1.0"
description = "Databricks-native FinOps medallion pipelines on Google Cloud"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML>=6.0",
  "google-cloud-storage>=3.0",
]

[project.optional-dependencies]
databricks = [
  "databricks-connect>=17.3,<17.4",
  "databricks-sdk>=0.60",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
finops-daily = "finops_cloud.jobs.daily_incremental:main"
finops-monthly = "finops_cloud.jobs.monthly_close:main"
finops-backfill = "finops_cloud.jobs.billing_backfill:main"
finops-archive = "finops_cloud.jobs.archive_retry:main"
finops_daily = "finops_cloud.jobs.daily_incremental:main"
finops_monthly = "finops_cloud.jobs.monthly_close:main"
finops_backfill = "finops_cloud.jobs.billing_backfill:main"
finops_archive = "finops_cloud.jobs.archive_retry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/finops_cloud/config" = ["config/*.toml"]
"share/finops_cloud/contracts/focus_cost_usage/v1.0.0" = ["contracts/focus_cost_usage/v1.0.0/*.yaml"]
"share/finops_cloud/sql" = ["sql/README.md"]
"share/finops_cloud/sql/infrastructure" = ["sql/infrastructure/*.sql"]
"share/finops_cloud/sql/gold" = ["sql/gold/*.sql"]
"share/finops_cloud/sql/datamarts" = ["sql/datamarts/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
