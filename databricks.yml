bundle:
  name: finops-cloud-data-platform

include:
  - platform/serverless/jobs/pipeline_jobs.yml

variables:
  environment:
    description: Logical configuration target
    default: dev
  git_branch:
    description: Git branch used by Databricks Python script tasks
    default: main

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: finops-gcp-dev
    variables:
      environment: dev

  prod:
    mode: production
    workspace:
      profile: finops-prod
    variables:
      environment: prod
