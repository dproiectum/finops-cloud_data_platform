resources:
  jobs:
    daily_incremental:
      name: finops-${var.environment}-daily-incremental
      # DEV cost guardrails: favor batch cost efficiency and cap parallel runs.
      performance_target: STANDARD
      max_concurrent_runs: 4
      git_source:
        git_url: https://github.com/dproiectum/finops-cloud_data_platform
        git_provider: gitHub
        git_branch: ${var.git_branch}
      parameters:
        - name: source_uri
          # Safe example; override it from Run now for another day.
          default: /Volumes/finops_raw/landing/focus/daily/year=2025/month=01/day=01/focus-2025-01-01.parquet
      tasks:
        - task_key: daily_incremental
          environment_key: default
          spark_python_task:
            python_file: scripts/run_daily_incremental.py
            source: GIT
            parameters:
              - --environment
              - ${var.environment}
              - --source-uri
              - "{{job.parameters.source_uri}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - PyYAML>=6.0
              - google-cloud-storage>=3.0

    monthly_close:
